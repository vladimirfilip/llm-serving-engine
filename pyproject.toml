[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serving-engine"
version = "0.1.0"
description = "LLM serving engine"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "triton>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "matplotlib>=3.8"]

[project.scripts]
llm-serve = "llm_serving_engine.server:main"
llm-loadgen = "llm_serving_engine.loadgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "cuda: needs a CUDA device; a CPU-only machine deselects these with -m 'not cuda'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "RUF"]

[tool.ruff.lint.per-file-ignores]
# E741 flags `O` as ambiguous. Q, K, V, O, L, m, l is the notation of the FlashAttention
# paper, and matching it makes the kernel checkable against the algorithm it implements.
"src/llm_serving_engine/kernels/flash_attention.py" = ["E741"]
